name: Build tweak

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle identifier of Projeto Grau 2 (e.g. com.company.game)"
        required: true
        type: string
      archs:
        description: "Architectures"
        required: false
        default: "arm64 arm64e"
        type: string

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          if ! [[ "$BUNDLE_ID" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid bundle id: '$BUNDLE_ID'"; exit 1
          fi

      - name: Install build tools
        run: brew install ldid dpkg make

      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Generate injection filter
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: sed "s/@BUNDLE_ID@/${BUNDLE_ID}/" ProjetoGrau2Cash.plist.in > ProjetoGrau2Cash.plist

      - name: Build
        env:
          ARCHS_IN: ${{ inputs.archs }}
        run: gmake clean package FINALPACKAGE=1 ARCHS="$ARCHS_IN"

      - uses: actions/upload-artifact@v4
        with:
          name: ProjetoGrau2Cash-deb
          path: packages/*.deb
          if-no-files-found: error
