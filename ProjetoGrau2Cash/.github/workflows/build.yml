name: Build tweak

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle identifier of Projeto Grau 2 (e.g. com.company.game)"
        required: true
        type: string
      archs:
        description: "Architectures"
        required: false
        default: "arm64 arm64e"
        type: string

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Locate tweak sources
        run: |
          MK=$(grep -rl --include=Makefile "TWEAK_NAME = ProjetoGrau2Cash" . | head -1 || true)
          if [ -z "$MK" ]; then
            echo "Makefile with TWEAK_NAME = ProjetoGrau2Cash not found in the repository. Files present:"
            find . -path ./.git -prune -o -type f -print
            exit 1
          fi
          DIR=$(dirname "$MK")
          for f in Tweak.mm Config.h Logic.h control; do
            [ -f "$DIR/$f" ] || { echo "Missing $DIR/$f"; find . -path ./.git -prune -o -type f -print; exit 1; }
          done
          echo "TWEAK_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Tweak sources in: $DIR"

      - name: Validate inputs
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          if ! [[ "$BUNDLE_ID" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid bundle id: '$BUNDLE_ID'"; exit 1
          fi

      - name: Install build tools
        run: brew install ldid dpkg make

      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Generate injection filter
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          cd "$TWEAK_DIR"
          printf '{ Filter = { Bundles = ( "%s" ); }; }\n' "$BUNDLE_ID" > ProjetoGrau2Cash.plist
          cat ProjetoGrau2Cash.plist

      - name: Build
        env:
          ARCHS_IN: ${{ inputs.archs }}
        run: |
          cd "$TWEAK_DIR"
          gmake clean package FINALPACKAGE=1 ARCHS="$ARCHS_IN"

      - uses: actions/upload-artifact@v4
        with:
          name: ProjetoGrau2Cash-deb
          path: ${{ env.TWEAK_DIR }}/packages/*.deb
          if-no-files-found: error
